model:
  backend: ollama          # ollama | llamacpp | openai
  base_url: http://localhost:11434/v1
  model_name: gemma4:e2b
  api_key: null            # required for openai; arbitrary string for ollama/llamacpp
  timeout: 60              # seconds
  temperature: 0.3         # null = model default; lower (0.0–0.3) improves tool calling reliability
  max_tokens: null         # null = model default; set to cap response length
  seed: null               # null = random; set to an integer for reproducible outputs
  tool_mode: api           # api    — native OpenAI tools= param; model returns structured tool_calls
                           # prompt — tools injected as JSON in system prompt; model returns JSON array
                           # lfm    — tools injected as list in system prompt; model returns <|tool_call_start|> tokens (LFM2.5)

agent:
  max_iterations: 10       # hard cap on think->act cycles per run
  system_prompt: "You are a helpful assistant."
  confirm_tools: false     # set true to require human approval before each tool call
  stop_after_tool_calls: false
  tool_call_confirmation: "Tool calls executed."
  retry_invalid_tool_calls: false
  max_tool_call_retries: 1
  history_turns: null      # persistent conversation history across run() calls
                           # null  — disabled (each run() starts fresh, no memory between turns)
                           # 0     — enabled, unbounded (keep full history for the session)
                           # N     — enabled, keep last N turns (recommended: 10–20 for small models)
                           # Note: state injection (Option A) is always active when a state_fn is
                           # passed to Agent() or Agent.from_config() — no YAML key required.

toolrag:
  enabled: true
  top_k: 5
  backend: tfidf           # tfidf | sentence-transformers
  st_model: null           # e.g. "all-MiniLM-L6-v2" if backend is sentence-transformers
  reselect_window: 3       # number of recent messages used as retrieval query each iteration
  reselect_roles:          # which message roles to include in the query
    - user
    - assistant

scratchpad:
  enabled: true
